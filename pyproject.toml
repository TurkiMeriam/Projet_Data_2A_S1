[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vrai-prix"
version = "0.1.0"
description = "Le Vrai Prix de la Ville : effet de la proximité des stations sur le prix au m² (Paris et petite couronne)"
requires-python = ">=3.10"
dependencies = ["pandas>=2.1", "numpy>=1.26", "pyarrow>=14", "requests>=2.31"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
